# DigitalOcean App Platform Configuration - Minimal Setup
# Cost: $5/month for Basic tier

name: nu-choate-league
region: nyc

# Backend API Service
services:
  - name: api
    # GitHub integration
    github:
      repo: YOUR_GITHUB_USERNAME/nu_choate_league
      branch: main
      deploy_on_push: true
    
    # Build configuration
    source_dir: /backend
    dockerfile_path: backend/Dockerfile
    
    # Environment variables
    envs:
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
        # Set this in the DigitalOcean UI after creating the app
        # Format: mongodb://username:password@YOUR_DROPLET_IP:27017/nu_choate_league?authSource=nu_choate_league
      
      - key: DATABASE_NAME
        scope: RUN_TIME
        value: nu_choate_league
      
      - key: SLEEPER_LEAGUE_ID
        scope: RUN_TIME
        value: "1251998020954763264"
      
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
        # Generate with: openssl rand -hex 32
        # Set this in the DigitalOcean UI
      
      - key: API_ENV
        scope: RUN_TIME
        value: production
      
      - key: PORT
        scope: RUN_TIME
        value: "8000"
    
    # Health check endpoint
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    
    # Port configuration
    http_port: 8000
    
    # Instance configuration (minimal for $5/month)
    instance_count: 1
    instance_size_slug: basic-xxs
    
    # Routes
    routes:
      - path: /api
      - path: /health
      - path: /

# Static site (serves your existing HTML reports from docs/)
static_sites:
  - name: frontend
    github:
      repo: YOUR_GITHUB_USERNAME/nu_choate_league
      branch: main
      deploy_on_push: true
    
    source_dir: /docs
    
    # No build command needed - already have static HTML
    output_dir: /docs
    
    # Index document
    index_document: index.html
    error_document: index.html
    
    # Routes
    routes:
      - path: /site

# Note: After creating this app in DigitalOcean:
# 1. Go to Settings > Environment Variables
# 2. Add MONGODB_URI with your connection string
# 3. Add JWT_SECRET with a generated secret
# 4. The app will auto-deploy from GitHub on every push
